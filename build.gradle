plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version "2.19.0"
}

group = 'com.mogudian.projecttabsrestored'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of((findProperty('buildJdkVersion') ?: '21') as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs += '-Xlint:deprecation'
}

tasks.withType(Jar).configureEach {
    from('LICENSE') {
        into('META-INF')
    }
}

repositories {
    mavenCentral()

    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        if (providers.gradleProperty('localIdePath').isPresent()) {
            local(providers.gradleProperty('localIdePath').get())
        } else {
            intellijIdeaCommunity(providers.gradleProperty('ideVersion').orElse('2024.3.5').get())
        }
    }
}

patchPluginXml {
    sinceBuild = '243.26053'
    changeNotes = """
    Initial release of this maintained fork, with project window merging restored for IntelliJ IDEA 2025 and 2026.
    """
}
test {
    useJUnitPlatform()
}
